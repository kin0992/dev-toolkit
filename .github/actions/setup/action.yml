name: 'Setup Node + pnpm'
description: 'Sets up Node.js (LTS by default) with pnpm and dependency caching.'
inputs:
  node-auth-token:
    description: 'Optional token exposed as NODE_AUTH_TOKEN to pnpm-related steps. Defaults to github.token.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token || github.token }}
      with:
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token || github.token }}
      with:
        node-version-file: .node-version
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token || github.token }}
      run: pnpm install --frozen-lockfile
