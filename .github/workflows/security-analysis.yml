name: Security Analysis (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Path to the project root for pnpm audit.'
        required: false
        type: string
        default: '.'
      codeql-languages:
        description: 'Comma-separated CodeQL languages to analyze.'
        required: false
        type: string
        default: 'javascript-typescript'
      audit-level:
        description: 'Minimum severity that fails pnpm audit (low, moderate, high, critical).'
        required: false
        type: string
        default: 'high'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # Required for CodeQL workflow analysis.
      security-events: write # Required to upload CodeQL results.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ inputs.codeql-languages }}
          # JS/TS is interpreted: no compilation needed, so skip the Autobuild
          # step entirely and let CodeQL extract source directly.
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4

  secret-scan:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan with trufflehog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --only-verified

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # Required by the setup action to install private packages.
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: $/.github/actions/setup

      - name: pnpm audit
        run: pnpm audit --prod --audit-level=${INPUTS_AUDIT_LEVEL}
        env:
          INPUTS_AUDIT_LEVEL: ${{ inputs.audit-level }}
