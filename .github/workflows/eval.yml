name: Evaluate Skills

on:
  pull_request:
    paths:
      - 'packages/skills/**'
      - 'evals/**'
      - '.waza.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/skills/**'
      - 'evals/**'
      - '.waza.yaml'

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate skills
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # Required to comment evaluation results on pull requests.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install waza
        env:
          WAZA_VERSION: v0.33.0
          WAZA_SHA256: c1a31a15d959d2cd536feb41cf7b20f94b0434a8e86949d3de3d21c1e3fb6ff3
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/waza \
            "https://github.com/microsoft/waza/releases/download/${WAZA_VERSION}/waza-linux-amd64"
          echo "${WAZA_SHA256}  /tmp/waza" | sha256sum -c -
          sudo install -m 0755 /tmp/waza /usr/local/bin/waza
          waza --version

      - name: Check skill compliance
        run: waza check

      - name: Run evaluations
        run: waza run --output results.json --format github-comment > comment.md

      - name: Show results
        if: always()
        run: cat comment.md || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: eval-results
          path: results.json

      # Fork PRs get a read-only GITHUB_TOKEN, so commenting would fail. Skip
      # them rather than failing the job; the results artifact is still uploaded.
      - name: Comment PR with results
        if: >-
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -s comment.md ]; then
            gh pr comment "$PR_NUMBER" --body-file comment.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
