name: Evaluate Skills

on:
  pull_request:
    paths:
      - 'packages/skills/**'
      - 'evals/**'
      - '.waza.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/skills/**'
      - 'evals/**'
      - '.waza.yaml'

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate skills
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # Required to comment evaluation results on pull requests.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install waza
        env:
          WAZA_VERSION: v0.40.1
          WAZA_SHA256: 44c26075e159b8d9e7253c9e45e47d2468c09f8180b8de8d522b4faf73767a5c
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/waza \
            "https://github.com/microsoft/waza/releases/download/${WAZA_VERSION}/waza-linux-amd64"
          echo "${WAZA_SHA256}  /tmp/waza" | sha256sum -c -
          sudo install -m 0755 /tmp/waza /usr/local/bin/waza
          waza --version

      - name: Check skill compliance
        run: waza check

      - name: Run evaluations
        run: waza run --output results.json --format github-comment > comment.md

      - name: Show results
        if: always()
        run: cat comment.md || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 7.0.2
        with:
          name: eval-results
          path: results.json

      # Fork PRs get a read-only GITHUB_TOKEN, so commenting would fail. Skip
      # them rather than failing the job; the results artifact is still uploaded.
      - name: Comment PR with results
        if: >-
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -s comment.md ]; then
            gh pr comment "$PR_NUMBER" --body-file comment.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
