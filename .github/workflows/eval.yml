name: Evaluate Skills

on:
  pull_request:
    paths:
      - 'packages/skills/**'
      - 'evals/**'
      - '.waza.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/skills/**'
      - 'evals/**'
      - '.waza.yaml'

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Install waza
        env:
          WAZA_VERSION: v0.33.0
          WAZA_SHA256: c1a31a15d959d2cd536feb41cf7b20f94b0434a8e86949d3de3d21c1e3fb6ff3
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/waza \
            "https://github.com/microsoft/waza/releases/download/${WAZA_VERSION}/waza-linux-amd64"
          echo "${WAZA_SHA256}  /tmp/waza" | sha256sum -c -
          sudo install -m 0755 /tmp/waza /usr/local/bin/waza
          waza --version

      - name: Check skill compliance
        run: waza check

      - name: Run evaluations
        run: waza run --output results.json -v

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: eval-results
          path: results.json

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        run: |
          waza run --format github-comment > comment.md 2>/dev/null || true
          if [ -s comment.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
