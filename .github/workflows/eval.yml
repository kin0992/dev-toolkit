name: Evaluate Skills

on:
  pull_request:
    paths:
      - 'packages/skills/**'
      - 'evals/**'
      - '.waza.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/skills/**'
      - 'evals/**'
      - '.waza.yaml'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Install waza
        run: curl -fsSL https://raw.githubusercontent.com/microsoft/waza/main/install.sh | bash

      - name: Check skill compliance
        run: waza check

      - name: Run evaluations
        run: waza run --output results.json -v

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: eval-results
          path: results.json

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        run: |
          waza run --format github-comment > comment.md 2>/dev/null || true
          if [ -s comment.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
