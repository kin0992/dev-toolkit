name: IaC Deploy (Pulumi)

on:
  workflow_call:
    inputs:
      stack:
        description: 'Pulumi stack name (e.g. kin0992/myapp/prod).'
        required: true
        type: string
      working-directory:
        description: 'Path to the Pulumi project.'
        required: false
        type: string
        default: 'infra'
      message:
        description: 'Optional message to associate with the update (audit trail).'
        required: false
        type: string
        default: ''
      cloud-url:
        description: 'Optional Pulumi backend URL (defaults to Pulumi Cloud).'
        required: false
        type: string
        default: ''
      pulumi-organization:
        description: 'Pulumi organization to log in to with OIDC instead of PULUMI_ACCESS_TOKEN. Requires GitHub registered as an OIDC issuer in that organization.'
        required: false
        type: string
        default: ''
      pulumi-token-type:
        description: 'Token type to request over OIDC: organization, team or personal.'
        required: false
        type: string
        default: 'organization'
      pulumi-token-scope:
        description: 'Scope for team (team:NAME) or personal (user:NAME) OIDC tokens.'
        required: false
        type: string
        default: ''
    secrets:
      PULUMI_ACCESS_TOKEN:
        description: 'Pulumi access token. Omit when pulumi-organization is set.'
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Pulumi deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Required for Pulumi OIDC authentication.
      packages: read # Required by the setup action to install private packages.
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # Inlined rather than calling .github/actions/pulumi-setup: a nested
      # composite action is resolved at run time, so a caller pinning this
      # workflow by SHA would still run whatever that action ref points to,
      # with a Pulumi token in the job. Every step here is fixed by the
      # caller's pin.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Pulumi login (OIDC)
        id: pulumi-oidc
        if: inputs.pulumi-organization != ''
        uses: pulumi/auth-actions@273044cc19e63ea565285da8edd4e059126a0bdb # v2.1.2
        with:
          organization: ${{ inputs.pulumi-organization }}
          requested-token-type: urn:pulumi:token-type:access_token:${{ inputs.pulumi-token-type }}
          scope: ${{ inputs.pulumi-token-scope }}
          cloud-url: ${{ inputs.cloud-url }}
          # Passed explicitly below instead: a step-level env would shadow
          # the exported variable with the empty secret.
          export-environment-variables: false

      - name: Pulumi login (custom backend)
        if: inputs.cloud-url != ''
        working-directory: ${{ github.workspace }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ steps.pulumi-oidc.outputs.pulumi-access-token || secrets.PULUMI_ACCESS_TOKEN }}
          CLOUD_URL: ${{ inputs.cloud-url }}
        run: pulumi login "$CLOUD_URL"

      - name: Pulumi Up
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # 7.1.0
        with:
          command: up
          stack-name: ${{ inputs.stack }}
          work-dir: ${{ inputs.working-directory }}
          message: ${{ inputs.message }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ steps.pulumi-oidc.outputs.pulumi-access-token || secrets.PULUMI_ACCESS_TOKEN }}
