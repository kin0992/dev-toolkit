name: IaC Deploy (Pulumi)

on:
  workflow_call:
    inputs:
      stack:
        description: 'Pulumi stack name (e.g. kin0992/myapp/prod).'
        required: true
        type: string
      working-directory:
        description: 'Path to the Pulumi project.'
        required: false
        type: string
        default: 'infra'
      message:
        description: 'Optional message to associate with the update (audit trail).'
        required: false
        type: string
        default: ''
      cloud-url:
        description: 'Optional Pulumi backend URL (defaults to Pulumi Cloud).'
        required: false
        type: string
        default: ''
    secrets:
      PULUMI_ACCESS_TOKEN:
        description: 'Pulumi Cloud access token (omit when using OIDC + self-managed backend).'
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Pulumi deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Required for Pulumi OIDC authentication.
      packages: read # Required by the setup action to install private packages.
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # Inlined rather than calling .github/actions/pulumi-setup: a nested
      # composite action is resolved at run time, so a caller pinning this
      # workflow by SHA would still run whatever that action ref points to,
      # with PULUMI_ACCESS_TOKEN in the job. Every step here is fixed by the
      # caller's pin.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Pulumi login (custom backend)
        if: inputs.cloud-url != ''
        working-directory: ${{ github.workspace }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUD_URL: ${{ inputs.cloud-url }}
        run: pulumi login "$CLOUD_URL"

      - name: Pulumi Up
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # 7.0.0
        with:
          command: up
          stack-name: ${{ inputs.stack }}
          work-dir: ${{ inputs.working-directory }}
          message: ${{ inputs.message }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
