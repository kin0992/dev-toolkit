name: Security

on:
  push:
    branches: [main]
    paths-ignore: &docs
      - '**/*.md'
      - 'LICENSE'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore: *docs
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security (self)
    permissions:
      contents: read
      packages: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security-analysis.yml
