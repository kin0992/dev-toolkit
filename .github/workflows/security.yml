name: Security

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.editorconfig'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security (self)
    permissions:
      contents: read
      packages: read # Required by the setup action to install private packages.
      actions: read # Required for security workflow analysis.
      security-events: write # Required to upload security analysis results.
    uses: ./.github/workflows/security-analysis.yml
