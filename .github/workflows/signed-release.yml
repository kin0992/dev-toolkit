name: Sign release assets

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to sign'
        required: true
        type: string

concurrency:
  group: signed-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  sign:
    name: Sign release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Required to create releases and upload signed assets.
      id-token: write # Required for keyless signing through Sigstore.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v4.1.2

      - name: Create signed release assets
        shell: bash
        run: |
          set -euo pipefail

          asset_prefix="${TAG//\//-}"
          archive="${asset_prefix}.tar.gz"
          bundle="${archive}.sigstore.json"

          git archive --format=tar.gz --prefix="${asset_prefix}/" "$TAG" -o "$archive"
          cosign sign-blob --yes --bundle "$bundle" "$archive"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi

          gh release upload "$TAG" "$archive" "$bundle" --clobber
