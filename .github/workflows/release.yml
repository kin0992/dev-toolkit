name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or Publish
    permissions:
      contents: write # Required to create release commits and tags.
      pull-requests: write # Required to create and update release pull requests.
      id-token: write # required for Trusted Publishing + provenance
    uses: ./.github/workflows/release-reusable.yml
    secrets:
      app_id: ${{ secrets.app_id }}
      app_private_key: ${{ secrets.app_private_key }}
