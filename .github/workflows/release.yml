name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or Publish
    permissions:
      contents: write
      pull-requests: write
      id-token: write # required for npm provenance
    uses: ./.github/workflows/release-reusable.yml
    with:
      npm-scope: '@kin0992'
    secrets: inherit
