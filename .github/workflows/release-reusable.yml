name: Release (reusable)

on:
  workflow_call:
    inputs:
      provenance:
        description: 'Publish with npm provenance (requires id-token: write and a public registry).'
        required: false
        type: boolean
        default: true
    secrets:
      app_id:
        description: 'GitHub App client ID used to mint a token for git ops and publishing.'
        required: true
      app_private_key:
        description: 'GitHub App private key (PEM).'
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write # required for npm provenance
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # 3.2.0
        with:
          client-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup
        uses: kin0992/dev-toolkit/.github/actions/setup@main

      - name: Build
        run: pnpm turbo run build

      # Publishing uses npm Trusted Publishing (OIDC): no npm token is written to
      # disk or exposed in the environment. npm exchanges this workflow's id-token
      # for a short-lived registry credential and signs provenance automatically.
      # Each package must have a Trusted Publisher configured on npmjs.org that
      # points at this repo's release.yml workflow, and npm must be >= 11.5.1
      # (satisfied by the Node version in .node-version).
      - name: Create release PR or publish
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # 1.8.0
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: 'Release new artifacts'
          title: 'Release new artifacts'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: ${{ inputs.provenance }}
