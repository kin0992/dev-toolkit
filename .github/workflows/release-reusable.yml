name: Release (reusable)

on:
  workflow_call:
    inputs:
      provenance:
        description: 'Publish with npm provenance (requires id-token: write and a public registry).'
        required: false
        type: boolean
        default: true
    secrets:
      app_id:
        description: 'GitHub App client ID used to mint a token for git ops and publishing.'
        required: true
      app_private_key:
        description: 'GitHub App private key (PEM).'
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Required to create release commits and tags.
      pull-requests: write # Required to create and update release pull requests.
      id-token: write # required for npm provenance
    steps:
      # This job holds the GitHub App private key and mints the npm OIDC publish
      # credential, so egress is locked down to the endpoints the release path
      # actually needs. If a release fails on a blocked endpoint, check the
      # harden-runner run summary ("insights") and add the host here.
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # 3.2.0
        with:
          client-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Build
        run: pnpm turbo run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # Publishing uses npm Trusted Publishing (OIDC): no npm token is written to
      # disk or exposed in the environment. npm exchanges this workflow's id-token
      # for a short-lived registry credential and signs provenance automatically.
      # Each package must have a Trusted Publisher configured on npmjs.org that
      # points at this repo's release.yml workflow, and npm must be >= 11.5.1
      # (satisfied by the Node version in .node-version).
      - name: Create release PR or publish
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          publish-script: pnpm release
          version-script: pnpm version-packages
          commit-message: 'Release new artifacts'
          pr-title: 'Release new artifacts'
        env:
          NPM_CONFIG_PROVENANCE: ${{ inputs.provenance }}
