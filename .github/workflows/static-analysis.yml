name: Static Analysis (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Path to the project root.'
        required: false
        type: string
        default: '.'
    secrets:
      TURBO_TOKEN:
        description: 'Vercel access token for Turbo remote cache.'
        required: false
      TURBO_TEAM:
        description: 'Vercel team or user slug for Turbo remote cache.'
        required: false

jobs:
  static-analysis:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: kin0992/dev-toolkit/.github/actions/setup@main

      - name: Code Review
        run: pnpm code-review
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
