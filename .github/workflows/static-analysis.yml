name: Static Analysis (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Path to the project root.'
        required: false
        type: string
        default: '.'
    secrets:
      TURBO_TOKEN:
        description: 'Vercel access token for Turbo remote cache.'
        required: false
      TURBO_TEAM:
        description: 'Vercel team or user slug for Turbo remote cache.'
        required: false

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis
    permissions:
      contents: read
      packages: read # Required by the setup action to install private packages.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: kin0992/dev-toolkit/.github/actions/setup@main

      - name: Code Review
        run: pnpm code-review
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
