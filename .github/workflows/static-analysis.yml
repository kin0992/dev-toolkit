name: Static Analysis (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Path to the project root.'
        required: false
        type: string
        default: '.'
    secrets:
      TURBO_TOKEN:
        description: 'Vercel access token for Turbo remote cache.'
        required: false
      TURBO_TEAM:
        description: 'Vercel team or user slug for Turbo remote cache.'
        required: false

permissions:
  contents: read

jobs:
  static-analysis:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Setup
        uses: kin0992/dev-toolkit/.github/actions/setup@main

      - name: Code Review
        run: pnpm code-review
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
