name: Static Analysis (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Path to the project root.'
        required: false
        type: string
        default: '.'

jobs:
  static-analysis:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: kin0992/dev-toolkit/.github/actions/setup@main
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Code Review
        run: pnpm code-review
