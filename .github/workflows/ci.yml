name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # Required to install packages from GitHub Packages.

jobs:
  static-analysis:
    name: Static Analysis (self)
    uses: ./.github/workflows/static-analysis.yml
    # Forward Turbo remote-cache creds explicitly (not `secrets: inherit`) so
    # fork PRs run cache-read-only and cannot poison the shared cache. Inert
    # until TURBO_TOKEN/TURBO_TEAM are added to repo secrets.
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  setup-self-test:
    name: Setup action self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # Required by the setup action to install private packages.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup (local action under test)
        uses: ./.github/actions/setup

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
          pnpm exec tsc --version
