name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  static-analysis:
    name: Static Analysis (self)
    uses: ./.github/workflows/static-analysis.yml
    with:
      working-directory: '.'
