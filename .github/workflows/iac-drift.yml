name: IaC Drift (Pulumi, reusable)

on:
  workflow_call:
    inputs:
      stack:
        description: 'Pulumi stack name (e.g. kin0992/myapp/dev).'
        required: true
        type: string
      working-directory:
        description: 'Path to the Pulumi project.'
        required: false
        type: string
        default: 'infra'
      node-version:
        description: 'Node.js version.'
        required: false
        type: string
        default: ''
      comment-on-pr:
        description: 'Comment preview on PRs.'
        required: false
        type: boolean
        default: true
      fail-on-drift:
        description: 'Fail the job when drift is detected.'
        required: false
        type: boolean
        default: true
      cloud-url:
        description: 'Optional Pulumi backend URL (defaults to Pulumi Cloud).'
        required: false
        type: string
        default: ''
    secrets:
      PULUMI_ACCESS_TOKEN:
        description: 'Pulumi Cloud access token (omit when using OIDC + self-managed backend).'
        required: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: kin0992/dev-toolkit/.github/actions/setup@main
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Pulumi login
        if: inputs.cloud-url != ''
        run: pulumi login "${{ inputs.cloud-url }}"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Pulumi preview (expect no changes)
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: ${{ inputs.stack }}
          work-dir: ${{ inputs.working-directory }}
          expect-no-changes: ${{ inputs.fail-on-drift }}
          comment-on-pr: ${{ inputs.comment-on-pr }}
          diff: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
