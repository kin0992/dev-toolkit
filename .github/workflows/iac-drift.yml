name: IaC Drift (Pulumi)

on:
  workflow_call:
    inputs:
      stack:
        description: 'Pulumi stack name (e.g. kin0992/myapp/dev).'
        required: true
        type: string
      working-directory:
        description: 'Path to the Pulumi project.'
        required: false
        type: string
        default: 'infra'
      comment-on-pr:
        description: 'Comment preview on PRs.'
        required: false
        type: boolean
        default: true
      cloud-url:
        description: 'Optional Pulumi backend URL (defaults to Pulumi Cloud).'
        required: false
        type: string
        default: ''
    secrets:
      PULUMI_ACCESS_TOKEN:
        description: 'Pulumi Cloud access token (omit when using OIDC + self-managed backend).'
        required: false

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Pulumi setup
        uses: kin0992/dev-toolkit/.github/actions/pulumi-setup@main
        with:
          cloud-url: ${{ inputs.cloud-url }}
          pulumi-access-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Pulumi Preview
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # 7.0.0
        with:
          command: preview
          stack-name: ${{ inputs.stack }}
          work-dir: ${{ inputs.working-directory }}
          expect-no-changes: false
          comment-on-pr: ${{ inputs.comment-on-pr }}
          diff: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
