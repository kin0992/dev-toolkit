name: IaC Drift

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/drift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    uses: ./.github/workflows/iac-drift.yml
    permissions:
      contents: read
      id-token: write # Required for Pulumi OIDC authentication.
      packages: read # Required by the setup action to install private packages.
      pull-requests: write # Required for Pulumi preview comments.
    with:
      stack: prod
      # Personal tokens work on every Pulumi edition; organization tokens need a paid one.
      pulumi-organization: kin0992
      pulumi-token-type: personal
      pulumi-token-scope: user:kin0992
