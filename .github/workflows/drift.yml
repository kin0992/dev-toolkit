name: IaC Drift

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/drift.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write
  packages: read

jobs:
  drift:
    uses: ./.github/workflows/iac-drift.yml
    with:
      stack: prod
    secrets:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
