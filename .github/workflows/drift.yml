name: IaC Drift

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/drift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    uses: ./.github/workflows/iac-drift.yml
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
    with:
      stack: prod
    secrets:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
