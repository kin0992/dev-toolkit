# Waza project configuration
# See: https://github.com/microsoft/waza

paths:
  skills: packages/skills/src
  evals: evals

tokens:
  warningThreshold: 2500
  fallbackLimit: 2000
  limits:
    defaults:
      'SKILL.md': 500
      # Waza's globstar requires a directory segment, so cover direct files too.
      'references/*.md': 1000
      'references/**/*.md': 1000
      '**/references/*.md': 1000
      '**/references/**/*.md': 1000
      '*.md': 2000
    overrides:
      'README.md': 3000
