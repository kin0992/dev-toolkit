packages:
  - 'packages/*'
  - 'infra'

allowBuilds:
  esbuild: true
  protobufjs: true

catalogs:
  core:
    '@types/node': ^24.13.2
    oxfmt: ^0.56.0
    oxlint: ^1.71.0
    typescript: ^6.0.3

autoInstallPeers: true
strictPeerDependencies: false
overrides:
  '@opentelemetry/core@<2.8.0': ^2.8.0
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  protobufjs@<=7.6.2: ^7.6.3
  tar@<=7.5.15: ^7.5.16
  undici@<6.27.0: ^6.27.0
  vite: ^7.3.5
minimumReleaseAgeExclude:
  - esbuild@0.28.1
  - protobufjs@7.6.3
  - tar@7.5.16
  - vite@7.3.5
  - '@opentelemetry/core@2.8.0'
  - undici@6.27.0
