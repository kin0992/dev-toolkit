name: branch-name-writing-quality
description: Opt-in live branch output and rationale contracts.
skill: writing-quality-evaluator
version: '1.0'

config:
  trials_per_task: 3
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: auto
  skill_directories:
    - ../../quality-driver
    - ../../../packages/skills/src/git/branch-name
  required_skills:
    - branch-name

metrics:
  - name: output_quality
    weight: 1.0
    threshold: 1.0

graders:
  - type: code
    name: no_wrapping_or_tracking_ids
    config:
      language: javascript
      assertions:
        - '!output.includes("```")'
        - '!/[A-Z]+-[0-9]+/.test(output)'

tasks:
  - 'single-branch.yaml'
  - 'multiple-branches.yaml'
